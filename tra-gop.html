<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Trả góp | Siêu Di Động</title>
  <meta name="description" content="Thông tin trả góp tại Siêu Di Động, công ty tài chính và nhân viên hỗ trợ Zalo.">
  <link rel="stylesheet" href="/style.css?v=225">
  <style>
    :root{--tg-orange:#f05a14;--tg-text:#111827;--tg-muted:#667085;--tg-line:#e4e7ec;--tg-soft:#fff6ed}
    *{box-sizing:border-box}
    body{margin:0;background:#f5f6f8;color:var(--tg-text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .tg-page{min-height:100vh}
    .tg-topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #eceff3}
    .tg-topbar-inner{max-width:980px;margin:0 auto;height:68px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .tg-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tg-text);font-weight:800}
    .tg-brand img{width:42px;height:42px;border-radius:10px;object-fit:cover}
    .tg-back{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border:1px solid var(--tg-line);border-radius:12px;text-decoration:none;color:#344054;font-weight:700;background:#fff}
    .tg-wrap{max-width:760px;margin:0 auto;padding:36px 18px 56px}
    .tg-card{background:#fff;border:1px solid #eaecf0;border-radius:22px;padding:28px;box-shadow:0 12px 34px rgba(16,24,40,.06)}
    .tg-eyebrow{display:block;color:var(--tg-orange);font-weight:900;font-size:14px;letter-spacing:.04em;margin-bottom:8px}
    h1{font-size:32px;line-height:1.15;margin:0 0 12px}
    .tg-intro{font-size:16px;line-height:1.65;color:#667085;margin:0 0 22px}
    .tg-provider-list{display:grid;gap:14px}
    .tg-provider{border:1px solid var(--tg-line);border-radius:18px;padding:18px;background:#fff}
    .tg-provider-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
    .tg-logo,.tg-logo-fallback{width:86px;height:60px;border-radius:13px;background:var(--tg-soft);object-fit:contain;padding:8px;flex:0 0 auto}
    .tg-logo-fallback{display:flex;align-items:center;justify-content:center;text-align:center;color:#e44d06;font-weight:900;font-size:14px;line-height:1.15}
    .tg-provider-head h2{margin:0 0 4px;font-size:21px}
    .tg-provider-head small{color:#667085;font-size:14px}
    .tg-staff{display:grid;gap:10px}
    .tg-person{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid #f0f2f5}
    .tg-person-copy{min-width:0;display:flex;flex-direction:column;gap:3px}
    .tg-person-copy strong{font-size:15px}
    .tg-person-copy span{font-size:14px;color:#667085;line-height:1.35}
    .tg-zalo{flex:0 0 auto;text-decoration:none;background:#0677e8;color:#fff;font-weight:800;border-radius:11px;padding:10px 14px;white-space:nowrap}
    .tg-empty{color:#667085;font-size:14px;padding:10px 0 2px}
    .tg-note{margin-top:18px;background:var(--tg-soft);color:#9a451d;border-radius:15px;padding:14px 16px;font-size:14px;line-height:1.5}
    .tg-loading{padding:20px 0;color:#667085}
    @media(max-width:640px){
      .tg-topbar-inner{height:60px;padding:0 14px}.tg-brand img{width:38px;height:38px}.tg-brand span{font-size:14px}
      .tg-wrap{padding:18px 12px 34px}.tg-card{padding:20px 16px;border-radius:18px}h1{font-size:25px}.tg-intro{font-size:15px}
      .tg-provider{padding:15px}.tg-logo,.tg-logo-fallback{width:74px;height:56px}.tg-provider-head h2{font-size:19px}
      .tg-person{align-items:flex-start;flex-direction:column}.tg-zalo{width:100%;text-align:center}
    }
  </style>
</head>
<body>
<div class="tg-page">
  <header class="tg-topbar">
    <div class="tg-topbar-inner">
      <a class="tg-back" href="/">← Trang chủ</a>
      <a class="tg-brand" href="/">
        <img src="/assets/logo-square.jpg" alt="Siêu Di Động">
        <span>SIÊU DI ĐỘNG</span>
      </a>
    </div>
  </header>

  <main class="tg-wrap">
    <section class="tg-card">
      <span class="tg-eyebrow">HỖ TRỢ MUA MÁY</span>
      <h1>Trả góp tại Siêu Di Động</h1>
      <p id="tgIntro" class="tg-intro">Đang tải thông tin trả góp...</p>
      <div id="tgProviderList" class="tg-provider-list"><div class="tg-loading">Đang tải...</div></div>
      <div class="tg-note">Hồ sơ và kết quả duyệt phụ thuộc công ty tài chính. Nhân viên sẽ tư vấn khoản trả trước, kỳ hạn và số tiền góp dự kiến trước khi đăng ký.</div>
    </section>
  </main>
</div>
<script>
(function(){
  const intro=document.getElementById('tgIntro');
  const list=document.getElementById('tgProviderList');
  const fallback={
    intro:'Siêu Di Động hỗ trợ tư vấn trả góp theo hồ sơ và sản phẩm thực tế. Nhân viên sẽ hỗ trợ số tiền trả trước, kỳ hạn và khoản góp dự kiến trước khi đăng ký.',
    providers:[
      {id:'hd-saison',name:'HD SAISON',logo:'',enabled:true,staff:[]},
      {id:'mirae-asset',name:'Mirae Asset',logo:'',enabled:true,staff:[]}
    ]
  };
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function zaloUrl(v){
    let raw=String(v||'').trim();
    if(!raw)return '';
    if(/^https?:\/\//i.test(raw))return raw;
    let n=raw.replace(/\D/g,'');
    if(n.startsWith('0'))n='84'+n.slice(1);
    return n?'https://zalo.me/'+n:'';
  }
  function render(data){
    const settings=data&&typeof data==='object'?data:fallback;
    intro.textContent=settings.intro||fallback.intro;
    const providers=(Array.isArray(settings.providers)?settings.providers:[]).filter(p=>p&&p.enabled!==false);
    list.innerHTML=providers.map(p=>{
      const name=esc(p.name||'Công ty tài chính');
      const logo=p.logo?`<img class="tg-logo" src="${esc(p.logo)}" alt="${name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:'';
      const fallbackLogo=`<div class="tg-logo-fallback"${p.logo?' style="display:none"':''}>${name}</div>`;
      const staff=(Array.isArray(p.staff)?p.staff:[]).filter(s=>s&&s.enabled!==false&&zaloUrl(s.zalo));
      const staffHtml=staff.length?staff.map(s=>`<div class="tg-person"><div class="tg-person-copy"><strong>${esc(s.name||'Nhân viên tư vấn')}</strong><span>${esc(s.note||'Tư vấn trả góp')}</span></div><a class="tg-zalo" href="${esc(zaloUrl(s.zalo))}" target="_blank" rel="noopener noreferrer">Nhắn Zalo</a></div>`).join(''):`<div class="tg-empty">Chưa cấu hình nhân viên Zalo cho đơn vị này.</div>`;
      return `<article class="tg-provider"><div class="tg-provider-head">${logo}${fallbackLogo}<div><h2>${name}</h2><small>Công ty tài chính</small></div></div><div class="tg-staff">${staffHtml}</div></article>`;
    }).join('')||'<div class="tg-empty">Hiện chưa có đơn vị trả góp đang bật.</div>';
  }
  fetch('/api/installment-settings',{cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(d=>render(d.settings||fallback))
    .catch(()=>render(fallback));
})();
</script>
</body>
</html>
