<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quản trị thông số | Siêu Di Động</title>
  <link rel="icon" type="image/jpeg" href="/assets/logo-square.jpg">
  <style>
    :root{
      --orange:#ff5a00;--bg:#f5f6f8;--card:#fff;--text:#171717;
      --muted:#6b7280;--line:#e5e7eb;--green:#16843b;--red:#c92a2a;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .top{height:64px;background:#fff;border-top:4px solid var(--orange);border-bottom:1px solid var(--line);display:flex;align-items:center}
    .top-inner{width:min(1180px,calc(100% - 28px));margin:auto;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand img{width:40px;height:40px;border-radius:9px}
    .wrap{width:min(1180px,calc(100% - 28px));margin:24px auto 40px}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.04)}
    .login{max-width:420px;margin:70px auto;padding:24px}.login h1{margin:0 0 6px;font-size:22px}.login p{margin:0 0 18px;color:var(--muted);font-size:13px}
    input,button{font:inherit}.field{width:100%;height:44px;border:1px solid #d9dde3;border-radius:9px;padding:0 12px;outline:none}.field:focus{border-color:#ff8b4a;box-shadow:0 0 0 3px rgba(255,90,0,.1)}
    .primary{height:40px;border:0;border-radius:8px;padding:0 15px;background:var(--orange);color:white;font-weight:700;cursor:pointer}
    .secondary{height:34px;border:1px solid #dfe2e6;border-radius:7px;padding:0 10px;background:white;font-weight:700;cursor:pointer}
    .danger{color:var(--red)}
    .head{padding:20px 20px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .head h1{margin:0;font-size:22px}.head p{margin:5px 0 0;color:var(--muted);font-size:12px}
    .search{width:min(420px,100%);height:42px;border:1px solid #dfe2e6;border-radius:9px;padding:0 12px}
    .stats{padding:10px 20px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
    .rows{padding:8px}
    .row{display:grid;grid-template-columns:minmax(220px,1fr) minmax(300px,2fr) auto;gap:10px;align-items:center;padding:10px;border-radius:9px}
    .row:hover{background:#fafafa}.model{min-width:0}.model strong{display:block;font-size:13px}.model small{display:block;margin-top:3px;color:var(--muted);font-size:10px}
    .url{width:100%;height:38px;border:1px solid #dfe2e6;border-radius:7px;padding:0 10px;font-size:12px}
    .actions{display:flex;gap:6px;white-space:nowrap}.ok{color:var(--green);font-size:11px;font-weight:700}.empty{padding:30px;text-align:center;color:var(--muted)}
    .message{margin-top:10px;font-size:12px}.hidden{display:none!important}
    @media(max-width:760px){
      .head{display:block}.search{margin-top:12px;width:100%}.row{grid-template-columns:1fr;gap:7px;border-bottom:1px solid #eee;border-radius:0}.actions{justify-content:flex-end}
    }
  </style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><img src="/assets/logo-square.jpg" alt=""><span>Quản trị thông số</span></div>
    <button id="logoutBtn" class="secondary hidden" type="button">Đăng xuất</button>
  </div>
</header>

<main class="wrap">
  <section id="loginCard" class="card login">
    <h1>Đăng nhập quản trị</h1>
    <p>Chỉ quản trị viên mới có thể xem và sửa link thông số.</p>
    <form id="loginForm">
      <input id="password" class="field" type="password" placeholder="Mật khẩu quản trị" autocomplete="current-password">
      <button class="primary" style="width:100%;margin-top:10px" type="submit">Đăng nhập</button>
      <div id="loginMessage" class="message"></div>
    </form>
  </section>

  <section id="adminCard" class="card hidden">
    <div class="head">
      <div>
        <h1>Link thông số sản phẩm</h1>
        <p>Dán đúng link trang nguồn cho từng model. Khách hàng không nhìn thấy trang này.</p>
      </div>
      <input id="search" class="search" type="search" placeholder="Tìm tên máy...">
    </div>
    <div id="stats" class="stats"></div>
    <div id="rows" class="rows"></div>
  </section>
</main>

<script>
const loginCard=document.getElementById("loginCard");
const adminCard=document.getElementById("adminCard");
const loginForm=document.getElementById("loginForm");
const password=document.getElementById("password");
const loginMessage=document.getElementById("loginMessage");
const logoutBtn=document.getElementById("logoutBtn");
const rows=document.getElementById("rows");
const stats=document.getElementById("stats");
const search=document.getElementById("search");

let products=[];
let links={};

function normalizeModel(name=""){
  return String(name).trim();
}

function setLoggedIn(value){
  loginCard.classList.toggle("hidden",value);
  adminCard.classList.toggle("hidden",!value);
  logoutBtn.classList.toggle("hidden",!value);
}

function mapItem(model){
  const direct=links[model];
  if(direct) return direct;

  const target=model.toLowerCase();
  const key=Object.keys(links)
    .sort((a,b)=>b.length-a.length)
    .find(k=>{
      const x=k.toLowerCase();
      return target===x || target.includes(x) || x.includes(target);
    });

  return key ? links[key] : null;
}

function render(){
  const q=search.value.trim().toLowerCase();

  const list=products.filter(p=>p.toLowerCase().includes(q));
  rows.innerHTML="";

  if(!list.length){
    rows.innerHTML='<div class="empty">Không tìm thấy sản phẩm.</div>';
    return;
  }

  list.forEach(model=>{
    const saved=mapItem(model);
    const row=document.createElement("div");
    row.className="row";

    const meta=document.createElement("div");
    meta.className="model";
    meta.innerHTML=`<strong>${model}</strong><small>${saved?.url ? '<span class="ok">✓ Đã gắn link</span>' : 'Chưa có link'}</small>`;

    const input=document.createElement("input");
    input.className="url";
    input.type="url";
    input.placeholder="Dán link trang thông số vào đây...";
    input.value=saved?.url || "";

    const actions=document.createElement("div");
    actions.className="actions";

    const save=document.createElement("button");
    save.type="button";
    save.className="secondary";
    save.textContent="Lưu";
    save.onclick=async()=>{
      save.disabled=true;
      save.textContent="Đang lưu...";
      try{
        const r=await fetch("/api/admin/spec-links",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({model,url:input.value})
        });
        const data=await r.json();
        if(!r.ok) throw new Error(data.error||"Lỗi");
        links[model]=data.item;
        render();
      }catch(e){
        alert(e.message);
      }finally{
        save.disabled=false;
        save.textContent="Lưu";
      }
    };

    const test=document.createElement("button");
    test.type="button";
    test.className="secondary";
    test.textContent="Kiểm tra";
    test.onclick=async()=>{
      if(!input.value.trim()){
        alert("Hãy dán link và bấm Lưu trước.");
        return;
      }

      test.disabled=true;
      test.textContent="Đang kiểm tra...";

      try{
        const r=await fetch("/api/specs?refresh=1&name="+encodeURIComponent(model),{cache:"no-store"});
        const data=await r.json();
        if(!r.ok) throw new Error(data.error||"Không đọc được thông số");
        alert(`OK - đọc được ${data.specs?.length||0} thông số.`);
      }catch(e){
        alert(e.message);
      }finally{
        test.disabled=false;
        test.textContent="Kiểm tra";
      }
    };

    const del=document.createElement("button");
    del.type="button";
    del.className="secondary danger";
    del.textContent="Xóa";
    del.onclick=async()=>{
      if(!confirm("Xóa link thông số của model này?")) return;
      const r=await fetch("/api/admin/spec-links",{
        method:"DELETE",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model})
      });
      const data=await r.json();
      if(!r.ok){ alert(data.error||"Lỗi"); return; }
      delete links[model];
      render();
    };

    actions.append(save,test,del);
    row.append(meta,input,actions);
    rows.appendChild(row);
  });

  const linked=products.filter(p=>mapItem(p)?.url).length;
  stats.textContent=`${products.length} model • ${linked} đã có link • ${products.length-linked} chưa có link`;
}

async function loadAdmin(){
  const r=await fetch("/api/admin/spec-links",{cache:"no-store"});

  if(r.status===401){
    setLoggedIn(false);
    return;
  }

  const data=await r.json();
  if(!r.ok) throw new Error(data.error||"Không tải được dữ liệu");

  links=data.links||{};

  const pr=await fetch("/api/products?ts="+Date.now(),{cache:"no-store"});
  const pd=await pr.json();

  const names=(pd.products||[])
    .map(p=>normalizeModel(p.name))
    .filter(Boolean);

  products=[...new Set(names)].sort((a,b)=>a.localeCompare(b,"vi"));
  setLoggedIn(true);
  render();
}

loginForm.addEventListener("submit",async(e)=>{
  e.preventDefault();
  loginMessage.textContent="Đang đăng nhập...";

  try{
    const r=await fetch("/api/admin/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({password:password.value})
    });
    const data=await r.json();
    if(!r.ok) throw new Error(data.error||"Đăng nhập thất bại");
    password.value="";
    loginMessage.textContent="";
    await loadAdmin();
  }catch(e){
    loginMessage.textContent=e.message;
  }
});

logoutBtn.addEventListener("click",async()=>{
  await fetch("/api/admin/logout",{method:"POST"});
  location.reload();
});

search.addEventListener("input",render);

loadAdmin().catch(e=>{
  loginMessage.textContent=e.message;
  setLoggedIn(false);
});
</script>
</body>
</html>
