<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Siêu Di Động | Điện thoại & sản phẩm công nghệ</title>
  <link rel="icon" type="image/jpeg" href="/assets/logo-square.jpg">
  <link rel="stylesheet" href="/styles.css?v=79">
</head>
<body>

<header class="commerce-header">
  <div class="commerce-header-inner">
    <a class="commerce-logo" href="/" aria-label="Siêu Di Động">
      <img class="commerce-logo-wide" src="/assets/logo-wide.jpg" alt="Siêu Di Động">
      <img class="commerce-logo-mobile" src="/assets/logo-square.jpg" alt="Siêu Di Động">
    </a>

    <div class="commerce-category-menu">
      <button class="commerce-category-btn" id="commerceCategoryBtn" type="button" aria-expanded="false">
        <span>☰</span>
        <strong>Danh mục</strong>
      </button>
      <div class="commerce-category-dropdown" id="commerceCategoryDropdown">
        <div class="category-menu-loading">Đang tải danh mục...</div>
      </div>
    </div>

    <div class="commerce-location">
      <span class="commerce-location-icon">⌖</span>
      <span>
        <small>Khu vực mua hàng</small>
        <strong>Quy Nhơn</strong>
      </span>
    </div>

    <div class="commerce-search">
      <input id="searchInput" type="search" placeholder="Bạn cần tìm sản phẩm gì?" autocomplete="off">
      <button id="clearSearch" type="button" aria-label="Xóa tìm kiếm">×</button>
      <span class="commerce-search-icon">⌕</span>
    </div>

    <div class="commerce-contact">
      <span class="commerce-contact-icon">☎</span>
      <span>
        <small>Gọi mua hàng</small>
        <strong>Siêu Di Động</strong>
      </span>
    </div>

    <div class="commerce-store">
      <span class="commerce-store-icon">▣</span>
      <span>
        <small>Cửa hàng</small>
        <strong>Quy Nhơn</strong>
      </span>
    </div>

    <div class="commerce-mini-icon" title="Giỏ hàng">🛒</div>
    <div class="commerce-mini-icon" title="Tài khoản">♙</div>
  </div>
</header>

<main class="page">

  
  <section class="catalog-overview">
    <span id="updatedAt" hidden></span>

    <div class="catalog-nav-row">
      <div class="catalog-brand-area">
        <div class="catalog-brand-label">Thương hiệu</div>
        <div id="categoryFilters" class="category-filters" aria-label="Lọc theo hãng"></div>
      </div>

      <div class="catalog-price-area">
        <div class="catalog-brand-label">Mức giá</div>
        <div id="priceFilters" class="price-filters" aria-label="Lọc theo giá"></div>
      </div>

      <div class="catalog-sort-area">
        <div class="catalog-brand-label">Sắp xếp</div>
        <select id="sortSelect" class="sort-select" aria-label="Sắp xếp sản phẩm">
          <option value="default">Mặc định</option>
          <option value="price-asc">Giá thấp đến cao</option>
          <option value="price-desc">Giá cao đến thấp</option>
          <option value="name-asc">Tên A → Z</option>
        </select>
      </div>
    </div>

    <div class="catalog-meta-row">
      <div id="summary" class="summary"></div>
    </div>
  </section>


  <section id="productGrid" class="product-grid">
    <div class="loading">Đang tải sản phẩm...</div>
  </section>

  <section id="inlineProductDetail" class="inline-product-detail" hidden></section>

  <footer class="footer">
    <div class="footer-brand">
      <img src="/assets/logo-square.jpg" alt="Siêu Di Động">
      <span>SIÊU DI ĐỘNG</span>
    </div>
    <div>Thông tin sản phẩm và giá bán được cập nhật thường xuyên.</div>
    <div>© 2026 Siêu Di Động</div>
  </footer>

</main>

<script src="/app.js?v=79"></script>

<a id="zaloConsultBtn" class="zalo-float" href="https://zalo.me/0353105423"
       target="_blank" rel="noopener noreferrer" aria-label="Chat Zalo với nhân viên tư vấn">
      <span class="zalo-float__icon" aria-hidden="true"><img src="/assets/zalo-contact-hd.png?v=78" alt=""></span>
      <span class="zalo-float__text">Bạn cần hỗ trợ?</span>
    </a>

</body>
</html>
