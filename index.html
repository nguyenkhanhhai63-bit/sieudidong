<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Siêu Di Động - Bảng giá</title>
  <link rel="icon" type="image/jpeg" href="/assets/logo-square.jpg">
  <link rel="stylesheet" href="/styles.css?v=5">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <img class="brand-logo-wide" src="/assets/logo-wide.jpg" alt="Siêu Di Động">
        <img class="brand-logo-square" src="/assets/logo-square.jpg" alt="Siêu Di Động">
      </div>
      </div>

      <label class="theme-toggle">
        <input id="darkMode" type="checkbox">
        <span>Giao diện tối</span>
      </label>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <div>
        <h1>Chọn máy dễ hơn, xem giá nhanh hơn</h1>
        <p>Giá bán và tình trạng hàng được đồng bộ trực tiếp từ hệ thống KiotViet.</p>
      </div>
      <div id="updatedAt" class="updated">Đang cập nhật...</div>
    </section>

    <section class="toolbar">
      <div class="search-row">
        <input id="searchInput" class="search" type="search" placeholder="Tìm tên máy..." autocomplete="off">
        <button id="clearSearch" class="clear-btn" type="button">Xóa</button>
      </div>

      <div class="filter-row">
        <label class="only-stock">
          <input id="onlyStock" type="checkbox" checked>
          <span>Chỉ hiện hàng còn tồn</span>
        </label>
        <div id="summary" class="summary"></div>
      </div>
    </section>

    <section id="productGrid" class="product-grid">
      <div class="loading">Đang tải dữ liệu KiotViet...</div>
    </section>

    <footer class="footer">
      <div class="footer-brand">
        <img src="/assets/logo-square.jpg" alt="Siêu Di Động">
        <span>SIÊU DI ĐỘNG</span>
      </div>
      <div>Giá bán được đồng bộ trực tiếp từ hệ thống KiotViet.</div>
      <div>© 2026 Siêu Di Động</div>
    </footer>
  </main>

  <script src="/app.js?v=5"></script>
</body>
</html>
