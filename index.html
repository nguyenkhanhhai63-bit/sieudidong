<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Siêu Di Động - Bảng giá</title>
  <link rel="icon" type="image/jpeg" href="/assets/logo-square.jpg">
  <link rel="stylesheet" href="/styles.css?v=23">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <img class="brand-logo-wide" src="/assets/logo-wide.jpg" alt="Siêu Di Động">
        <img class="brand-logo-square" src="/assets/logo-square.jpg" alt="Siêu Di Động">
      </div>

      <label class="theme-toggle">
        <input id="darkMode" type="checkbox">
        <span>Giao diện tối</span>
      </label>
    </div>
  </header>

  <main class="page">
    <section class="page-title">
      <div>
        <h1>Bảng giá Siêu Di Động</h1>
        <p>Giá bán và tình trạng hàng được cập nhật thường xuyên.</p>
      </div>
      <div id="updatedAt" class="updated">Đang cập nhật...</div>
    </section>

    <section class="toolbar">
      <div class="search-row">
        <input id="searchInput" class="search" type="search" placeholder="Tìm tên máy..." autocomplete="off">
        <button id="clearSearch" class="clear-btn" type="button">Xóa</button>
      </div>

      <div class="brand-filter-block"><div class="filter-label">Hãng điện thoại</div><div id="categoryFilters" class="category-filters" aria-label="Lọc theo hãng"></div></div>

      <div class="filter-row">
        
        <div id="summary" class="summary"></div>
      </div>
    </section>

    <section id="productGrid" class="product-grid">
      <div class="loading">Đang tải bảng giá...</div>
    </section>

    <footer class="footer">
      <div class="footer-brand">
        <img src="/assets/logo-square.jpg" alt="Siêu Di Động">
        <span>SIÊU DI ĐỘNG</span>
      </div>
      <div>Thông tin sản phẩm và giá bán được cập nhật thường xuyên.</div>
      <div>© 2026 Siêu Di Động</div>
    </footer>
  </main>

  <script src="/bestsellers.js?v=23"></script>
  <script src="/app.js?v=23"></script>
</body>
</html>
